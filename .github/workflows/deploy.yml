name: Deploy React Frontend

on:
  push:
    branches:
      - stage-saas

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 46.202.140.221 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 46.202.140.221
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html/sas-stage-crm-frontend

            echo "🔄 Resetting and pulling code..."
            git reset --hard
            git pull origin new-code
            
            # Load NVM + Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22
            
            echo "📦 Installing dependencies..."
            npm install --force

            echo "🏗️ Building new version into build_new..."
            BUILD_PATH=build_new npm run build

            echo "🚀 Running zero downtime swap..."
            bash deploy.sh
